[package]
name = "gitcalver-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CLI for gitcalver: deterministic version numbers from git history"

[[bin]]
name = "gitcalver"
path = "src/main.rs"

[dependencies]
gitcalver = { path = "../gitcalver" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
