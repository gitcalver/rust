name: CI

on:
  # push covers every branch (including main); pull_request covers fork PRs.
  # Same-repo PRs trigger both events; concurrency keys on event_name so they
  # don't cancel each other—accepted in exchange for branch-level coverage
  # without requiring an open PR.
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make lint
      - run: make test

  acceptance:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        object-format: [sha1, sha256]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gitcalver/sh
          ref: 857287da052d1437703ead1f7d2adc76a95451ba
          path: conformance-sh
      # GIT_DEFAULT_HASH is set per step: at job level it would also make
      # actions/checkout initialise a SHA-256 repository it cannot fetch into.
      - run: make test
        env:
          GIT_DEFAULT_HASH: ${{ matrix.object-format }}
      - run: make acceptance CONFORMANCE_DIR=conformance-sh
        env:
          GIT_DEFAULT_HASH: ${{ matrix.object-format }}

  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - run: cargo install cargo-llvm-cov --locked
      - run: make coverage
