name: CI

on:
  # push covers every branch (including main); pull_request covers fork PRs.
  # Same-repo PRs trigger both events; concurrency keys on event_name so they
  # don't cancel each other—accepted in exchange for branch-level coverage
  # without requiring an open PR.
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: make lint
      - run: make test

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - run: cargo install cargo-llvm-cov --locked
      - run: make coverage
