name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      id-token: write # Authenticates the release to the package registry through OIDC.
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        id: auth
      - run: make publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
    name: publish
    needs: verify
  verify:
    name: Verify release
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] Reusable CI resolves to the caller's commit.
