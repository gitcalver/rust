name: Publish

on:
  # crates.io Trusted Publishing rejects the `workflow_run` trigger, so we
  # cannot gate this workflow on CI completion. Use branch protection on
  # `main` to ensure CI passes before a commit reaches this trigger.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: auth
      - run: make publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
