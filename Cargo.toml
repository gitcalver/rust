[package]
# `version` and `publish = true` are intentionally omitted; `make publish`
# injects both transiently at publish time. (Cargo rejects `publish` without
# a `version`, and the default version "0.0.0" is fine for local use.)
name = "gitcalver"
edition = "2024"
license = "MIT"
description = "Deterministic version numbers from git history"
documentation = "https://docs.rs/gitcalver"
homepage = "https://gitcalver.org"
repository = "https://github.com/gitcalver/rust"

[dependencies]
gix = { version = "0.81", default-features = false, features = ["status", "revision", "sha1"] }
thiserror = "2"
time = "0.3"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
option_if_let_else = "allow"
