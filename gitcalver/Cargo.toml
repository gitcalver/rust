[package]
name = "gitcalver"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic version numbers from git history"

[dependencies]
gix = { version = "0.81", default-features = false, features = ["status", "revision", "sha1"] }
thiserror = "2"
time = "0.3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
